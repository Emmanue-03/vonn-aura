<style>

    --color-muted: rgba(112, 38, 51, 0.68);
    --color-soft: rgba(112, 38, 51, 0.06);
    --color-soft-2: rgba(112, 38, 51, 0.12);
    --ok: #2f7a4d;
    --warn: #b8770b;
    --bad: #a3303a;
    --info: #5a4ca8;

    --font-title: 'EB Garamond', Georgia, serif;
    --font-ui: 'Inter', Arial, sans-serif;

    --radius-card: 22px;
    --radius-pill: 999px;
    --radius-input: 12px;
    --shadow-soft: 0 18px 50px rgba(112, 38, 51, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--color-principal); color: var(--color-secundario); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; font-size: 14px; }
  body { min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }
  ::selection { background: var(--color-secundario); color: var(--color-principal); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(112,38,51,.22); border-radius: 999px; }

  /* LAYOUT */
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .sidebar { background: var(--color-card); border-right: 1px solid var(--color-borde); padding: 22px 16px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
  .brand { font-family: var(--font-title); font-size: 22px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-secundario); padding: 6px 8px; }
  .brand .it { font-style: italic; font-weight: 500; text-transform: lowercase; letter-spacing: 0; }
  .brand small { display: block; font-family: var(--font-ui); font-size: 9px; letter-spacing: .35em; margin-top: 4px; color: var(--color-muted); }

  .nav-section { display: flex; flex-direction: column; gap: 4px; }
  .nav-section h6 { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--color-muted); padding: 14px 12px 6px; font-weight: 500; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; color: var(--color-secundario); font-size: 12.5px; font-weight: 500; transition: background .25s, color .25s; border: 1px solid transparent; }
  .nav-item:hover { background: var(--color-soft); }
  .nav-item.active { background: var(--color-secundario); color: var(--color-principal); }
  .nav-item .ico { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; opacity: .9; }
  .nav-item .count { margin-left: auto; font-size: 10px; padding: 2px 8px; border-radius: 999px; background: var(--color-soft-2); color: var(--color-secundario); font-weight: 600; }
  .nav-item.active .count { background: rgba(248,236,231,.18); color: var(--color-principal); }

  .sidebar-foot { margin-top: auto; padding: 16px 12px 6px; border-top: 1px solid var(--color-borde); font-size: 11px; color: var(--color-muted); }

  /* MAIN */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 16px; padding: 18px 28px; border-bottom: 1px solid var(--color-borde); background: rgba(248,236,231,.84); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 10; }
  .crumbs { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-muted); }
  .crumbs strong { color: var(--color-secundario); font-weight: 600; }
  .search { margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--color-card); border: 1px solid var(--color-borde); border-radius: var(--radius-pill); width: 320px; max-width: 40vw; }
  .search input { border: 0; outline: 0; background: transparent; flex: 1; color: var(--color-secundario); font-size: 13px; }
  .search input::placeholder { color: var(--color-muted); }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--color-borde); background: var(--color-card); display: inline-flex; align-items: center; justify-content: center; color: var(--color-secundario); transition: background .25s; position: relative; }
  .icon-btn:hover { background: var(--color-soft); }
  .icon-btn .dot { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--color-secundario); }
  .user-chip { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border: 1px solid var(--color-borde); border-radius: var(--radius-pill); background: var(--color-card); }
  .user-chip .av { width: 32px; height: 32px; border-radius: 50%; background: var(--color-secundario); color: var(--color-principal); display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-title); font-style: italic; font-weight: 500; font-size: 14px; }
  .user-chip .name { font-size: 12px; font-weight: 600; line-height: 1.1; }
  .user-chip .role { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--color-muted); }

  .view { padding: 28px 28px 80px; display: flex; flex-direction: column; gap: 26px; }
  .view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .view-head h1 { font-family: var(--font-title); font-size: 42px; font-weight: 500; line-height: 1; letter-spacing: -.01em; }
  .view-head h1 .it { font-style: italic; }
  .view-head p { color: var(--color-muted); margin-top: 8px; max-width: 540px; line-height: 1.6; }

  /* BOTONES */
  .btn { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; padding: 12px 22px; border-radius: var(--radius-pill); border: 1px solid transparent; transition: all .3s; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
  .btn-primary { background: var(--color-secundario); color: var(--color-principal); border-color: var(--color-secundario); }
  .btn-primary:hover { background: #5a1d29; }
  .btn-ghost { background: transparent; color: var(--color-secundario); border-color: var(--color-secundario); }
  .btn-ghost:hover { background: var(--color-secundario); color: var(--color-principal); }
  .btn-soft { background: var(--color-soft); color: var(--color-secundario); }
  .btn-soft:hover { background: var(--color-soft-2); }
  .btn-danger { background: transparent; color: var(--bad); border-color: rgba(163,48,58,.4); }
  .btn-danger:hover { background: var(--bad); color: #fff; border-color: var(--bad); }
  .btn-mini { padding: 7px 12px; font-size: 10px; letter-spacing: .14em; }

  /* CARDS / PANELS */
  .panel { background: var(--color-card); border: 1px solid var(--color-borde); border-radius: var(--radius-card); padding: 26px; }
  .panel.lg { padding: 32px; }
  .panel h3 { font-family: var(--font-title); font-size: 22px; font-weight: 500; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
  .panel-head .lbl { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--color-muted); }

  /* STATS GRID */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .stat { background: var(--color-card); border: 1px solid var(--color-borde); border-radius: var(--radius-card); padding: 24px; display: flex; flex-direction: column; gap: 14px; min-height: 140px; transition: transform .35s ease, box-shadow .35s ease; }
  .stat:hover { transform: translateY(-3px); box-shadow: var(--shadow-soft); }
  .stat .top { display: flex; justify-content: space-between; align-items: center; }
  .stat .lbl { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--color-muted); }
  .stat .ico { width: 36px; height: 36px; border-radius: 12px; background: var(--color-soft); display: inline-flex; align-items: center; justify-content: center; color: var(--color-secundario); }
  .stat .num { font-family: var(--font-title); font-size: 38px; font-weight: 500; line-height: 1; }
  .stat .delta { font-size: 11px; color: var(--color-muted); display: flex; align-items: center; gap: 6px; }
  .stat .delta.up { color: var(--ok); }
  .stat .delta.down { color: var(--bad); }

  /* GRID 2 COL */
  .grid-2 { display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

  /* CHART CSS bars */
  .chart { display: flex; align-items: flex-end; gap: 14px; height: 200px; padding: 12px 0 6px; border-bottom: 1px solid var(--color-borde); }
  .bar { flex: 1; background: linear-gradient(180deg, var(--color-secundario), #5a1d29); border-radius: 8px 8px 0 0; position: relative; min-height: 4px; transition: opacity .3s; cursor: pointer; }
  .bar:hover { opacity: .8; }
  .bar .v { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--color-secundario); font-weight: 600; white-space: nowrap; }
  .chart-x { display: flex; gap: 14px; padding: 10px 0 0; }
  .chart-x span { flex: 1; text-align: center; font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--color-muted); }

  /* TABLE */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 880px; table-layout: auto; }
  th, td { text-align: left; padding: 12px 14px; font-size: 13px; vertical-align: middle; }
  th { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--color-muted); font-weight: 500; border-bottom: 1px solid var(--color-borde); background: rgba(112,38,51,.02); white-space: nowrap; }
  tbody tr { border-bottom: 1px solid var(--color-borde); transition: background .25s; }
  tbody tr:hover { background: var(--color-soft); }
  tbody tr:last-child { border-bottom: 0; }
  td .name { font-family: var(--font-title); font-size: 16px; font-weight: 500; line-height: 1.2; }
  td .sub { font-size: 11px; color: var(--color-muted); margin-top: 2px; }
  td:nth-child(2) { min-width: 220px; }
  .thumb { width: 40px; height: 40px; border-radius: 10px; background: var(--color-soft); display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-title); font-style: italic; color: var(--color-secundario); font-size: 16px; border: 1px solid var(--color-borde); flex-shrink: 0; }

  /* TAGS / BADGES */
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; background: var(--color-soft); color: var(--color-secundario); border: 1px solid var(--color-borde); }
  .tag.ok { background: rgba(47,122,77,.10); color: var(--ok); border-color: rgba(47,122,77,.25); }
  .tag.warn { background: rgba(184,119,11,.10); color: var(--warn); border-color: rgba(184,119,11,.25); }
  .tag.bad { background: rgba(163,48,58,.10); color: var(--bad); border-color: rgba(163,48,58,.25); }
  .tag.info { background: rgba(90,76,168,.10); color: var(--info); border-color: rgba(90,76,168,.25); }
  .tag .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* PILLS / FILTERS */
  .pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--color-borde); background: var(--color-card); color: var(--color-secundario); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; transition: all .3s; }
  .pill:hover { border-color: var(--color-secundario); }
  .pill.active { background: var(--color-secundario); color: var(--color-principal); border-color: var(--color-secundario); }

  /* INPUTS */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 10px; letter-spacing: .25em; text-transform: uppercase; color: var(--color-muted); font-weight: 500; }
  .field input, .field select, .field textarea { background: var(--color-principal); border: 1px solid var(--color-borde); border-radius: var(--radius-input); padding: 12px 14px; color: var(--color-secundario); font-size: 14px; outline: 0; transition: border-color .25s; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--color-secundario); }
  .field textarea { min-height: 100px; resize: vertical; font-family: inherit; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-grid .full { grid-column: 1 / -1; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(58,18,26,.42); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
  .modal { background: var(--color-principal); border: 1px solid var(--color-borde); border-radius: 26px; padding: 32px; width: 100%; max-width: 680px; max-height: 92vh; overflow-y: auto; box-shadow: 0 40px 100px rgba(58,18,26,.32); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  .modal-head h2 { font-family: var(--font-title); font-size: 28px; font-weight: 500; }
  .modal-foot { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--color-borde); }
  .close-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--color-borde); background: transparent; color: var(--color-secundario); font-size: 16px; }

  /* TOAST */
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--color-secundario); color: var(--color-principal); padding: 16px 22px; border-radius: 14px; font-size: 13px; box-shadow: 0 14px 40px rgba(58,18,26,.32); z-index: 200; animation: toastIn .4s ease; }
  @keyframes toastIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  /* ROW actions */
  .row-actions { display: flex; gap: 6px; }
  .row-actions button { padding: 6px 10px; font-size: 10px; letter-spacing: .12em; border-radius: 8px; border: 1px solid var(--color-borde); background: transparent; color: var(--color-secundario); text-transform: uppercase; transition: all .25s; }
  .row-actions button:hover { background: var(--color-secundario); color: var(--color-principal); border-color: var(--color-secundario); }
  .row-actions button.del:hover { background: var(--bad); border-color: var(--bad); }

  /* EMPTY */
  .empty { padding: 60px 20px; text-align: center; color: var(--color-muted); }
  .empty h4 { font-family: var(--font-title); font-size: 22px; color: var(--color-secundario); margin-bottom: 8px; }

  /* LIST item */
  .list-item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--color-borde); }
  .list-item:last-child { border-bottom: 0; }
  .list-item .main { flex: 1; min-width: 0; }
  .list-item .name { font-family: var(--font-title); font-size: 16px; font-weight: 500; }
  .list-item .meta { font-size: 11px; color: var(--color-muted); letter-spacing: .04em; margin-top: 2px; }
  .list-item .right { text-align: right; font-size: 13px; color: var(--color-secundario); font-weight: 600; }

  /* RESPONSIVE */
  @media (max-width: 1024px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 80%; max-width: 320px; transform: translateX(-100%); transition: transform .35s; z-index: 50; box-shadow: 0 20px 60px rgba(58,18,26,.2); }
    .sidebar.open { transform: translateX(0); }
    .topbar { padding: 16px 20px; }
    .search { width: 200px; }
    .view { padding: 24px 20px 80px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .menu-btn { display: inline-flex !important; }
  }
  @media (max-width: 600px) {
    .view-head h1 { font-size: 32px; }
    .search { display: none; }
    .user-chip .name, .user-chip .role { display: none; }
    .stats { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    th, td { padding: 10px 12px; font-size: 12px; }
  }
  .menu-btn { display: none; }
</style>
</head>

// -------- HOOK persistente --------
function useStored(key, seed) {
  const [data, setData] = useState(() => LS.get(key, seed));
  useEffect(() => { LS.set(key, data); }, [key, data]);
  return [data, setData];
}

// -------- TOAST --------
function useToast() {
  const [msg, setMsg] = useState('');
  useEffect(() => { if (!msg) return; const t = setTimeout(() => setMsg(''), 2200); return () => clearTimeout(t); }, [msg]);
  return [msg, setMsg];
}

// -------- PRODUCTS --------
function Products({ products, setProducts, openToast }) {
  const [filter, setFilter] = useState('todos');
  const [q, setQ] = useState('');
  const [editing, setEditing] = useState(null);

  const filters = ['todos', 'destacados', 'mujer', 'hombre', 'unisex', 'low'];
  const filtered = products.filter(p => {
    if (filter === 'destacados' && !p.featured) return false;
    if (!['todos','destacados','low'].includes(filter) && p.gender !== filter) return false;
    if (filter === 'low' && p.status === 'active') return false;
    if (q && !(p.name + p.brand + p.notes).toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  });
  const toggleFeatured = (id) => setProducts(products.map(x => x.id === id ? { ...x, featured: !x.featured } : x));

  const save = (p) => {
    if (p.id && products.find(x => x.id === p.id)) {
      setProducts(products.map(x => x.id === p.id ? p : x));
      openToast('Perfume actualizado · ' + p.name);
    } else {
      const np = { ...p, id: newId('P') };
      setProducts([np, ...products]);
      openToast('Perfume creado · ' + p.name);
    }
    setEditing(null);
  };
  const del = (id) => {
    if (confirm('¿Eliminar este perfume del catálogo?')) {
      setProducts(products.filter(p => p.id !== id));
      openToast('Perfume eliminado');
    }
  };

  return (
    <div className="view">
      <div className="view-head">
        <div>
          <h1>Catálogo de <span className="it">perfumes.</span></h1>
          <p>Curaduría de la colección: alta perfumería, ediciones limitadas y novedades.</p>
        </div>
        <button className="btn btn-primary" onClick={() => setEditing({ name:'', brand:'Vonn Aura', family:'', notes:'', image:'', size:'100ml', price:0, stock:0, status:'active', gender:'unisex', intensity:'eau de parfum', occasion:'noche', featured: false })}><Icon.plus/> Nuevo perfume</button>
      </div>

      <div className="panel">
        <div className="panel-head">
          <div className="pill-row">
            {filters.map(f => <button key={f} className={`pill ${filter === f ? 'active' : ''}`} onClick={() => setFilter(f)}>{f === 'low' ? 'Stock bajo' : f === 'destacados' ? '★ Destacados' : f}</button>)}
          </div>
          <div className="search" style={{ width: 260 }}><Icon.search /><input placeholder="Buscar por nombre o nota…" value={q} onChange={e => setQ(e.target.value)} /></div>
        </div>
        <div className="table-wrap">
          <table>
            <thead><tr><th></th><th>Perfume</th><th>Familia</th><th>Notas clave</th><th>Tamaño</th><th>Precio</th><th>Stock</th><th>Estado</th><th></th></tr></thead>
            <tbody>
              {filtered.map(p => (
                <tr key={p.id}>
                  <td>{p.image ? <img src={p.image} alt={p.name} className="thumb" style={{ objectFit: 'contain', padding: 4 }} onError={(e) => { e.target.outerHTML = '<div class="thumb">' + p.name[0] + '</div>'; }} /> : <div className="thumb">{p.name[0]}</div>}</td>
                  <td><div className="name">{p.name}</div><div className="sub">{p.brand} · {p.id}</div></td>
                  <td>{p.family}</td>
                  <td><div className="sub" style={{ marginTop: 0 }}>{p.notes}</div></td>
                  <td>{p.size}</td>
                  <td><strong>{money(p.price)}</strong></td>
                  <td>{p.stock}</td>
                  <td><span className={`tag ${statusTagClass(p.status)}`}><span className="d"></span>{p.status === 'active' ? 'Activo' : p.status === 'low' ? 'Stock bajo' : 'Agotado'}</span></td>
                  <td><div className="row-actions"><button onClick={() => setEditing(p)}>Editar</button><button className="del" onClick={() => del(p.id)}>Borrar</button></div></td>
                </tr>
              ))}
              {filtered.length === 0 && <tr><td colSpan="9"><div className="empty"><h4>Sin resultados</h4><p>Probá quitar filtros o ajustar la búsqueda.</p></div></td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      {editing && <ProductModal product={editing} onClose={() => setEditing(null)} onSave={save} />}
    </div>
  );
}

          <div className="field"><label>Contraseña</label><input type="password" required value={pass} onChange={e => { setPass(e.target.value); setErr(''); }} placeholder="••••••••" /></div>
          {err && <div style={{ fontSize: 12, color: 'var(--bad)', padding: '8px 12px', background: 'rgba(163,48,58,.08)', borderRadius: 10, border: '1px solid rgba(163,48,58,.2)' }}>{err}</div>}
          <button type="submit" className="btn btn-primary" style={{ marginTop: 8, justifyContent: 'center' }}>Entrar al atelier</button>
        </form>
        <div style={{ marginTop: 24, padding: 14, background: 'var(--color-soft)', borderRadius: 12, fontSize: 11, color: 'var(--color-muted)', lineHeight: 1.6 }}>
          <strong style={{ color: 'var(--color-secundario)' }}>Acceso demo:</strong><br/>
          admin@vonnaura.com · aura2026
        </div>
      </div>
    </div>
  );
}

function Users({ users, setUsers, current, openToast }) {
  const [editing, setEditing] = useState(null);
  const save = (u) => {
    if (!u.name || !u.email || !u.password) { openToast('Completá todos los campos'); return; }
    if (u.id && users.find(x => x.id === u.id)) {
      setUsers(users.map(x => x.id === u.id ? u : x));
      openToast('Usuario actualizado');
    } else {
      const nu = { ...u, id: newId('U'), initials: u.name.split(' ').map(p => p[0]).slice(0,2).join('').toUpperCase() };
      setUsers([nu, ...users]);
      openToast('Usuario creado · ' + u.email);
    }
    setEditing(null);
  };
  const del = (id) => {
    if (id === current.id) { openToast('No podés borrar el usuario activo'); return; }
    if (users.length <= 1) { openToast('Debe quedar al menos un admin'); return; }
    if (confirm('¿Eliminar este usuario admin?')) {
      setUsers(users.filter(u => u.id !== id));
      openToast('Usuario eliminado');
    }
  };
  return (
    <div className="view">
      <div className="view-head">
        <div>
          <h1>Usuarios <span className="it">admin.</span></h1>
          <p>Quién tiene acceso al atelier. Cada cuenta puede gestionar el catálogo y los pedidos.</p>
        </div>
        <button className="btn btn-primary" onClick={() => setEditing({ name: '', email: '', password: '', role: 'Curadora' })}><Icon.plus/> Nuevo admin</button>
      </div>

      <div className="panel">
        <div className="panel-head">
          <div><span className="lbl">Cuentas activas</span><h3>{users.length} {users.length === 1 ? 'administrador' : 'administradores'}</h3></div>
        </div>
        <div className="table-wrap">
          <table>
            <thead><tr><th></th><th>Nombre</th><th>Email</th><th>Rol</th><th>Contraseña</th><th></th></tr></thead>
            <tbody>
              {users.map(u => (
                <tr key={u.id}>
                  <td><div className="thumb">{u.initials || u.name[0]}</div></td>
                  <td><div className="name">{u.name}{u.id === current.id && <span className="tag ok" style={{ marginLeft: 10 }}><span className="d"></span>vos</span>}</div><div className="sub">{u.id}</div></td>
                  <td>{u.email}</td>
                  <td>{u.role}</td>
                  <td><span style={{ fontFamily: 'monospace', color: 'var(--color-muted)' }}>{'•'.repeat(Math.min(u.password.length, 10))}</span></td>
                  <td><div className="row-actions"><button onClick={() => setEditing(u)}>Editar</button><button className="del" onClick={() => del(u.id)}>Borrar</button></div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <div className="panel">
        <div className="panel-head"><div><span className="lbl">Seguridad</span><h3>Sobre las credenciales</h3></div></div>
        <p style={{ color: 'var(--color-muted)', lineHeight: 1.6, fontSize: 13 }}>
          Las credenciales se guardan en <code>localStorage</code> del navegador para esta demo. Si conectás un backend real, deberían moverse a la base de datos con hash (bcrypt/argon2) y autenticación por token. El panel ya tiene la pantalla de login y sesión persistente listas para enchufar a una API.
        </p>
      </div>

      {editing && (
        <div className="modal-overlay">
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-head"><div><span className="crumbs">{editing.id ? 'Editar' : 'Nuevo'}</span><h2>Usuario admin</h2></div><button className="close-btn" onClick={() => setEditing(null)}>×</button></div>
            <div className="form-grid">
              <div className="field"><label>Nombre</label><input value={editing.name} onChange={e => setEditing({ ...editing, name: e.target.value })} placeholder="Aura Maison" /></div>
              <div className="field"><label>Rol</label>
                <select value={editing.role} onChange={e => setEditing({ ...editing, role: e.target.value })}>
                  <option>Curadora</option><option>Gerente</option><option>Atelier</option><option>Soporte</option>
                </select>
              </div>
              <div className="field full"><label>Email de acceso</label><input type="email" value={editing.email} onChange={e => setEditing({ ...editing, email: e.target.value })} placeholder="nombre@vonnaura.com" /></div>
              <div className="field full"><label>Contraseña</label><input type="text" value={editing.password} onChange={e => setEditing({ ...editing, password: e.target.value })} placeholder="Mínimo 6 caracteres" /></div>
            </div>
            <div className="modal-foot"><button className="btn btn-ghost" onClick={() => setEditing(null)}>Cancelar</button><button className="btn btn-primary" onClick={() => save(editing)}>{editing.id ? 'Guardar' : 'Crear usuario'}</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

function NotificationsBell({ products, decants, orders, subs, go }) {
  const [open, setOpen] = useState(false);
  const [readIds, setReadIds] = useStored('vonn_notif_read', []);
  const ref = useRef(null);

  const items = useMemo(() => {
    const list = [];
    orders.filter(o => o.status === 'pendiente').forEach(o => {
      list.push({ id: 'ord-' + o.id, type: 'order', tag: 'Pedido', tagCls: 'warn', title: 'Nuevo pedido ' + o.id, sub: o.customer + ' · ' + money(o.total), action: () => go('orders'), date: o.date });
    });
    [...products, ...decants].filter(p => p.status === 'low' || p.status === 'out').forEach(p => {
      const name = p.name || (p.origin + ' · ' + p.ml + 'ml');
      list.push({ id: 'stk-' + p.id, type: 'stock', tag: p.status === 'out' ? 'Agotado' : 'Stock bajo', tagCls: p.status === 'out' ? 'bad' : 'warn', title: name, sub: p.id + ' · ' + (p.status === 'out' ? 'Reponer urgente' : (p.stock + ' unidades restantes')), action: () => go(p.ml ? 'decants' : 'products'), date: '' });
    });
    subs.slice(0, 3).forEach(s => {
      list.push({ id: 'sub-' + s.id, type: 'sub', tag: 'Suscriptor', tagCls: 'info', title: s.email, sub: 'Origen: ' + s.source, action: () => go('newsletter'), date: s.date });
    });
    return list;
  }, [products, decants, orders, subs]);

  const unread = items.filter(i => !readIds.includes(i.id)).length;

  useEffect(() => {
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);

  const markAll = () => setReadIds(items.map(i => i.id));
  const pick = (it) => { if (!readIds.includes(it.id)) setReadIds([...readIds, it.id]); it.action(); setOpen(false); };

  return (
    <div ref={ref} style={{ position: 'relative' }}>
      <button className="icon-btn" onClick={() => setOpen(o => !o)} aria-label="Notificaciones">
        <Icon.bell/>
        {unread > 0 && <span className="dot"></span>}
      </button>
      {open && (
        <div style={{ position: 'absolute', right: 0, top: 'calc(100% + 8px)', width: 360, maxWidth: '90vw', background: 'var(--color-card)', border: '1px solid var(--color-borde)', borderRadius: 18, boxShadow: 'var(--shadow-soft)', zIndex: 40, maxHeight: 460, display: 'flex', flexDirection: 'column' }}>
          <div style={{ padding: '14px 18px', borderBottom: '1px solid var(--color-borde)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div>
              <div style={{ fontSize: 14, fontWeight: 600 }}>Notificaciones</div>
              <div style={{ fontSize: 11, color: 'var(--color-muted)', marginTop: 2 }}>{unread} sin leer · {items.length} totales</div>
            </div>
            {unread > 0 && <button onClick={markAll} style={{ background: 'transparent', border: 0, color: 'var(--color-secundario)', fontSize: 11, letterSpacing: '.14em', textTransform: 'uppercase', cursor: 'pointer', fontWeight: 500 }}>Marcar leídas</button>}
          </div>
          <div style={{ overflowY: 'auto', flex: 1 }}>
            {items.length === 0 && (
              <div className="empty"><h4>Todo en orden</h4><p>Sin pedidos pendientes ni stock crítico.</p></div>
            )}
            {items.map(it => {
              const isRead = readIds.includes(it.id);
              return (
                <button key={it.id} onClick={() => pick(it)} style={{ width: '100%', textAlign: 'left', padding: '12px 18px', background: isRead ? 'transparent' : 'rgba(112,38,51,.04)', border: 0, borderBottom: '1px solid var(--color-borde)', cursor: 'pointer', display: 'flex', flexDirection: 'column', gap: 6, transition: 'background .2s' }} onMouseEnter={(e) => e.currentTarget.style.background = 'var(--color-soft)'} onMouseLeave={(e) => e.currentTarget.style.background = isRead ? 'transparent' : 'rgba(112,38,51,.04)'}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 }}>
                    <span className={`tag ${it.tagCls}`}><span className="d"></span>{it.tag}</span>
                    {!isRead && <span style={{ width: 7, height: 7, borderRadius: '50%', background: 'var(--color-secundario)', flexShrink: 0 }}></span>}
                  </div>
                  <div style={{ fontFamily: 'var(--font-title)', fontSize: 15, fontWeight: 500, color: 'var(--color-secundario)' }}>{it.title}</div>
                  <div style={{ fontSize: 11, color: 'var(--color-muted)' }}>{it.sub}{it.date && ' · ' + it.date}</div>
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function UserChip({ user, onLogout, onProfile }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);
  return (
    <div ref={ref} style={{ position: 'relative' }}>
      <button className="user-chip" onClick={() => setOpen(o => !o)} style={{ border: '1px solid var(--color-borde)', cursor: 'pointer' }}>
        <span className="av">{user.initials || user.name[0]}</span>
        <div style={{ textAlign: 'left' }}><div className="name">{user.name}</div><div className="role">{user.role}</div></div>
      </button>
      {open && (
        <div style={{ position: 'absolute', right: 0, top: 'calc(100% + 8px)', minWidth: 220, background: 'var(--color-card)', border: '1px solid var(--color-borde)', borderRadius: 16, padding: 8, boxShadow: 'var(--shadow-soft)', zIndex: 30 }}>
          <div style={{ padding: '12px 14px', borderBottom: '1px solid var(--color-borde)', marginBottom: 6 }}>
            <div style={{ fontSize: 13, fontWeight: 600 }}>{user.name}</div>
            <div style={{ fontSize: 11, color: 'var(--color-muted)', marginTop: 2 }}>{user.email}</div>
          </div>
          <button onClick={() => { onProfile(); setOpen(false); }} style={{ width: '100%', textAlign: 'left', padding: '10px 14px', background: 'transparent', border: 0, color: 'var(--color-secundario)', fontSize: 13, borderRadius: 10, cursor: 'pointer' }}>Gestionar usuarios</button>
          <button onClick={() => { onLogout(); setOpen(false); }} style={{ width: '100%', textAlign: 'left', padding: '10px 14px', background: 'transparent', border: 0, color: 'var(--bad)', fontSize: 13, borderRadius: 10, cursor: 'pointer' }}>Cerrar sesión</button>
        </div>
      )}
    </div>
  );
}

// -------- ROOT --------
function App() {
  const [users, setUsers] = useStored('vonn_users', seedUsers);
  const [session, setSession] = useStored('vonn_session', null);
  const [view, setView] = useState('home');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [toast, setToast] = useToast();
  const [products, setProducts]   = useStored('vonn_products',  seedProducts);
  const [decants, setDecants]     = useStored('vonn_decants',   seedDecants);
  const [orders, setOrders]       = useStored('vonn_orders',    seedOrders);
  const [customers, setCustomers] = useStored('vonn_customers', seedCustomers);
  const [notes, setNotes]         = useStored('vonn_notes',     seedNotes);
  const [subs, setSubs]           = useStored('vonn_subs',      seedSubs);
  const [settings, setSettings]   = useStored('vonn_settings', {
    brand: 'Vonn Aura', tagline: 'El aroma del devenir',
    colorPrimary: '#F8ECE7', colorSecondary: '#702633',
    currency: 'PYG', locale: 'es', email: 'atelier@vonnaura.com',
    shipping: 35000, freeShipping: 800000,
    notif_0: true, notif_1: true, notif_2: false, notif_3: true,
  });

  const current = session ? users.find(u => u.id === session.userId) : null;
  if (!current) return <Login users={users} onLogin={(u) => setSession({ userId: u.id, since: Date.now() })} />;

  const counts = {
    products: products.length,
    decants: decants.length,
    orders: orders.filter(o => o.status === 'pendiente' || o.status === 'preparando').length,
    customers: customers.length,
    notes: notes.length,
    newsletter: subs.length,
  };

  const go = (k) => { setView(k); setSidebarOpen(false); };

  const currentLabel = NAV.flatMap(g => g.items).find(i => i.key === view)?.label || 'Panel';

  return (
    <div className="app">
      <aside className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
        <div className="brand">Vonn <span className="it">aura</span><small>· Atelier · panel</small></div>
        {NAV.map(group => (
          <div className="nav-section" key={group.group}>
            <h6>{group.group}</h6>
            {group.items.map(it => {
              const Ico = Icon[it.icon];
              return (
                <a key={it.key} className={`nav-item ${view === it.key ? 'active' : ''}`} onClick={() => go(it.key)}>
                  <span className="ico"><Ico/></span>
                  <span>{it.label}</span>
                  {counts[it.key] !== undefined && <span className="count">{counts[it.key]}</span>}
                </a>
              );
            })}
          </div>
        ))}
        <div className="sidebar-foot">
          <div>v 1.0 · build editorial</div>
          <a href="VONN AURA.html" style={{ display: 'inline-flex', gap: 6, alignItems: 'center', marginTop: 8, color: 'var(--color-secundario)' }}><Icon.external/> Ver tienda pública</a>
        </div>
      </aside>

      <main className="main">
        <div className="topbar">
          <button className="icon-btn menu-btn" onClick={() => setSidebarOpen(o => !o)}><Icon.menu/></button>
          <div className="crumbs">Atelier · <strong>{currentLabel}</strong></div>
          <div className="search"><Icon.search/><input placeholder="Buscar perfumes, pedidos, clientes…" /></div>
          <NotificationsBell products={products} decants={decants} orders={orders} subs={subs} go={go} />
          <UserChip user={current} onLogout={() => { if (confirm('¿Cerrar sesión?')) setSession(null); }} onProfile={() => go('users')} />
        </div>

        {view === 'home'       && <Dashboard products={products} decants={decants} orders={orders} customers={customers} subs={subs} go={go} />}
        {view === 'products'   && <Products products={products} setProducts={setProducts} openToast={setToast} />}
        {view === 'decants'    && <Decants decants={decants} setDecants={setDecants} products={products} openToast={setToast} />}
        {view === 'orders'     && <Orders orders={orders} setOrders={setOrders} openToast={setToast} />}
        {view === 'customers'  && <Customers customers={customers} setCustomers={setCustomers} openToast={setToast} />}
        {view === 'notes'      && <Notes notes={notes} setNotes={setNotes} openToast={setToast} />}
        {view === 'newsletter' && <Newsletter subs={subs} setSubs={setSubs} openToast={setToast} />}
        {view === 'users'      && <Users users={users} setUsers={setUsers} current={current} openToast={setToast} />}
        {view === 'settings'   && <Settings settings={settings} setSettings={setSettings} openToast={setToast} />}
      </main>

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
